name: Deploy SIKUR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare production site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          if [ -d icons ]; then
            mkdir -p _site/icons
            cp -R icons/. _site/icons/
          fi
          if [ -d app ]; then
            mkdir -p _site/app
            cp -R app/. _site/app/
          fi
          if [ -d pantau ]; then
            mkdir -p _site/pantau
            cp -R pantau/. _site/pantau/
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
